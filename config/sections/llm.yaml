id: llm
title: LLM 개발사
public: true
order: 1
max_items: 5            # 상한이 아니라 기준. 넘기면 이유를 PR 요약에 적는다

# 원문 발행 시각이 직전 실행 시각 ~ 이번 실행 시각 안이어야 한다.
# 루틴 주기(매일·매주)를 바꿔도 따로 고칠 필요 없다. scripts/fetch.py window로 확인
window:
  since_last_run: true
  hours: 24             # 직전 실행 기록이 없을 때
  max_days: 8           # 직전 실행이 이보다 오래됐으면 여기까지만

# feed가 있으면 scripts/fetch.py feeds로, 없으면 scripts/fetch.py page로 읽는다.
# 자동 요청을 막는 곳(blocked)은 우회하지 않는다. 해당 소식은 언론 보도나 검색으로 찾고 원문 링크만 건다.
sources:
  - name: Anthropic 뉴스
    url: https://www.anthropic.com/news
    role: primary
  - name: Claude 플랫폼 릴리스 노트
    url: https://platform.claude.com/docs/en/release-notes/overview
    role: primary
  - name: Claude Code 변경 기록
    url: https://raw.githubusercontent.com/anthropics/claude-code/refs/heads/main/CHANGELOG.md
    role: primary       # 버전별 날짜가 없다. 큰 변경만, 다른 출처와 함께
  - name: Google 블로그 AI
    url: https://blog.google/innovation-and-ai/technology/ai/
    feed: https://blog.google/technology/ai/rss/
    role: primary
  - name: Google DeepMind 블로그
    url: https://deepmind.google/blog/
    feed: https://deepmind.google/blog/rss.xml
    role: primary
  - name: Gemini 릴리스 노트
    url: https://gemini.google/release-notes/
    role: primary
  - name: OpenAI 뉴스
    url: https://openai.com/news/
    feed: https://openai.com/news/rss.xml
    role: primary
  - name: ChatGPT 릴리스 노트
    url: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
    role: blocked       # 자동 요청 차단(403)
  - name: Codex 변경 기록
    url: https://learn.chatgpt.com/docs/changelog
    role: primary
  - name: 언론 보도
    role: secondary     # 해석이 필요한 큰 발표에만
